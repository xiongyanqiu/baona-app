name: 编 ipa（未签名）

# 用法：推到 GitHub 后，仓库页面 → Actions → 左边「编 ipa（未签名）」→ 右边 Run workflow
# 跑完在这个 run 页面最下面 Artifacts 里下载 baona-ipa（里面就是 BaonaApp-unsigned.ipa）
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    # ★v27.0.14.1 锁定稳定编译机：之前用 macos-latest（滚动标签），GitHub 升级编译机后
    #   新 Xcode 编译产物在手机上启动闪退（v27.0.13 之前一直正常）。
    # ★v27.0.14.16 macos-14 runner 下线、macos-13 排队 6 小时进不去 → 换 macos-15（当前主力池）。
    runs-on: macos-15
    # ★27.0.16.16 加了 sherpa-onnx 真人语音引擎（C++ 源码 pod，编译很慢）→ 45 分钟不够，提到 90
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 报一下环境（Xcode 版本）
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: 拉依赖
        run: |
          flutter --version
          flutter config --no-enable-swift-package-manager   # ★27.0.16.11 onnxruntime 要 iOS16+静态链接，统一走 CocoaPods（ios/Podfile 已配）
          flutter pub get

      - name: 编未签名 iOS 包（xcodebuild 直编，绕开 flutter 的签名检查）
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= build

      - name: 打成 ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/DerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry BaonaApp-unsigned.ipa Payload
          ls -lh BaonaApp-unsigned.ipa
          unzip -l BaonaApp-unsigned.ipa | head -20
          md5 BaonaApp-unsigned.ipa

      - name: 传上去（下载用）
        uses: actions/upload-artifact@v4
        with:
          name: baona-ipa
          path: BaonaApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
